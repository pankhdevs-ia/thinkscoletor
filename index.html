<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Inventário de PCs</title>
    <!-- Tailwind CSS para um design moderno sem complicação -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Cabeçalho -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-3">
                    <i class="fa-solid fa-server text-indigo-400"></i> Inventário de Hardware
                </h1>
                <p class="text-slate-400 text-sm mt-1">Cole o JSON recebido do seu script ou preencha para gerar o relatório.</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-2">
                <button onclick="carregarExemplo()" class="bg-slate-700 hover:bg-slate-600 text-sm px-4 py-2 rounded-xl transition font-medium">Carregar Exemplo</button>
                <button onclick="limparCampos()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 text-sm px-4 py-2 rounded-xl transition font-medium border border-rose-500/30">Limpar</button>
            </div>
        </header>

        <!-- Entrada de Dados (JSON do Script) -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-lg mb-8 border border-slate-700">
            <label class="block text-sm font-semibold mb-2 text-indigo-300">Cole o JSON do seu Script PowerShell aqui:</label>
            <textarea id="jsonInput" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 font-mono" placeholder='{"computador": "PC-01", ...}' oninput="processarDados()"></textarea>
        </div>

        <!-- Seção de Visualização / Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <span class="text-xs text-slate-400 uppercase font-bold tracking-wider">Máquina / Hostname</span>
                <p id="view-computador" class="text-lg font-semibold mt-1 text-white">-</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <span class="text-xs text-slate-400 uppercase font-bold tracking-wider">Usuário Atual</span>
                <p id="view-usuario" class="text-lg font-semibold mt-1 text-white">-</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <span class="text-xs text-slate-400 uppercase font-bold tracking-wider">Processador (CPU)</span>
                <p id="view-cpu" class="text-sm font-medium mt-1 text-slate-200">-</p>
            </div>
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <span class="text-xs text-slate-400 uppercase font-bold tracking-wider">Memória RAM</span>
                <p id="view-ram" class="text-sm font-medium mt-1 text-slate-200">-</p>
            </div>
        </div>

        <!-- Botão de Copiar para WhatsApp -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 flex flex-col items-center">
            <h3 class="text-lg font-semibold mb-3 text-emerald-400 flex items-center gap-2">
                <i class="fa-brands fa-whatsapp"></i> Formato para WhatsApp
            </h3>
            <textarea id="whatsappOutput" readonly rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-300 font-mono mb-4 resize-none"></textarea>
            <button onclick="copiarParaWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-6 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/20">
                <i class="fa-solid fa-copy"></i> Copiar Especificações Formatadas
            </button>
            <p id="toast" class="text-xs text-emerald-400 mt-2 opacity-0 transition-opacity">Copiado para a área de transferência com sucesso!</p>
        </div>
    </div>

    <script>
        function processarDados() {
            try {
                const raw = document.getElementById('jsonInput').value;
                if (!raw.trim()) return;
                const data = JSON.parse(raw);

                // Atualiza Cards do Dashboard
                document.getElementById('view-computador').innerText = `${data.computador || 'N/A'} (${data.tipo || 'PC'})`;
                document.getElementById('view-usuario').innerText = data.usuario || 'N/A';
                document.getElementById('view-cpu').innerText = data.processador || 'N/A';
                document.getElementById('view-ram').innerText = `${data.ram_detalhes || data.ram_total + ' GB'} (Uso: ${data.ram_uso || 'N/A'})`;

                // Monta o Padrão Formatado para o WhatsApp
                const textoWhats = 
`*RELATÓRIO DE EQUIPAMENTO*
----------------------------------
*Hostname:* ${data.computador || '-'}
*Tipo:* ${data.tipo || '-'}
*Empresa/Setor:* ${data.empresa || '-'} / ${data.setor || '-'}
*Modelo:* ${data.fabricante_modelo || '-'}
*Serial Number:* ${data.serial_number || '-'}
*Usuário:* ${data.usuario || '-'}

*HARDWARE:*
• *CPU:* ${data.processador || '-'}
• *RAM:* ${data.ram_detalhes || data.ram_total + ' GB'} (Uso: ${data.ram_uso || '-'})
• *GPU:* ${data.gpu || '-'}
• *Armazenamento:* ${data.tamanho_ssd || '-'} (Livre: ${data.disco_livre || '-'} GB)
• *Saúde SSD:* ${data.saude_ssd || '-'}

*SISTEMA E SUPORTE:*
• *SO:* ${data.so || '-'}
• *Rede:* ${data.rede || '-'}
• *AnyDesk:* ${data.anydesk || '-'}
• *TeamViewer:* ${data.teamviewer || '-'}
----------------------------------
*Coletado em:* ${data.data || new Date().toLocaleString()}`;

                document.getElementById('whatsappOutput').value = textoWhats;
            } catch (e) {
                // Se o JSON ainda estiver incompleto ou digitando, ignora o erro temporariamente
            }
        }

        function carregarExemplo() {
            const exemplo = {
                "data": "13/11/2026 10:45",
                "empresa": "Matriz",
                "setor": "TI",
                "computador": "SUPORTE-NOTE01",
                "tipo": "Notebook",
                "fabricante_modelo": "Dell Inc. Latitude 5420",
                "serial_number": "5CG94512X",
                "usuario": "suporte.tecnico",
                "processador": "Intel(R) Core(TM) i5-1145G7 @ 2.60GHz",
                "ram_detalhes": "16 GB (3200 MHz / DDR4)",
                "ram_uso": "45.2%",
                "gpu": "Intel Iris Xe Graphics",
                "tamanho_ssd": "238 GB",
                "disco_total": 238.5,
                "disco_usado": 120.4,
                "disco_livre": 118.1,
                "saude_ssd": "95% (Healthy)",
                "so": "Microsoft Windows 11 Pro (64-bit)",
                "rede": "192.168.1.50 | MAC: AA:BB:CC:DD:EE:FF",
                "anydesk": "123 456 789",
                "teamviewer": "987 654 321"
            };
            document.getElementById('jsonInput').value = JSON.stringify(exemplo, null, 2);
            processarDados();
        }

        function limparCampos() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('view-computador').innerText = '-';
            document.getElementById('view-usuario').innerText = '-';
            document.getElementById('view-cpu').innerText = '-';
            document.getElementById('view-ram').innerText = '-';
            document.getElementById('whatsappOutput').value = '';
        }

        function copiarParaWhatsApp() {
            const textarea = document.getElementById('whatsappOutput');
            if(!textarea.value) return;
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        // Carrega o exemplo ao iniciar para ver pronto
        window.onload = carregarExemplo;
    </script>
</body>
</html>
